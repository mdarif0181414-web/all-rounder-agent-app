name: 24/7 Autonomous Agent Worker

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:
    inputs:
      brief:
        description: "Optional brief to run directly (leave empty to take from the Supabase queue)"
        required: false
        default: ""
      project:
        description: "Channel or client tag (e.g. yt_channel_1 or fiverr_client)"
        required: false
        default: "general"
      max_jobs:
        description: "Max jobs to run in one run"
        required: false
        default: "2"

concurrency:
  group: autonomous-agent-worker
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. 3-Second Queue Pre-Check
        id: check_queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MANUAL_BRIEF: ${{ github.event.inputs.brief }}
        run: |
          if [ -n "$MANUAL_BRIEF" ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(curl -sS "${SUPABASE_URL%/}/rest/v1/agent_jobs?select=id&status=eq.pending&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            | python3 -c "import sys, json; data=json.load(sys.stdin); print(len(data) if isinstance(data, list) else 0)")
          echo "Pending jobs found: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 2. Checkout Repository
        if: steps.check_queue.outputs.has_work == 'true'
        uses: actions/checkout@v4

      - name: 3. Setup Python 3.11 + Pip Cache
        if: steps.check_queue.outputs.has_work == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: stage7/requirements.txt

      - name: 4. Install Dependencies, ffmpeg & Playwright
        if: steps.check_queue.outputs.has_work == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r stage7/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m playwright install chromium --with-deps || true

      - name: 5. Run Autonomous Worker
        if: steps.check_queue.outputs.has_work == 'true'
        working-directory: stage7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python worker.py \
            --brief "${{ github.event.inputs.brief }}" \
            --project "${{ github.event.inputs.project || 'general' }}" \
            --max-jobs "${{ github.event.inputs.max_jobs || '2' }}"

      - name: 6. Upload Deliverable Artifacts
        if: steps.check_queue.outputs.has_work == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-deliverables-${{ github.run_number }}
          path: stage7/artifacts/
          retention-days: 14
          if-no-files-found: ignore
